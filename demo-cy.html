<body>
<div class="stats" id="stats"></div>
<div id="legend"><h4>主题（点击聚焦）</h4></div>
<div id="cy"></div>
<div class="hint"><b>点击板块</b>展开/收起 &nbsp;|&nbsp; <b>悬停知识点</b>看前后置链 &nbsp;|&nbsp; <b>点击</b>看详情<br><b>滚轮</b>缩放 &nbsp;|&nbsp; <b>拖拽空白</b>平移 &nbsp;|&nbsp; 紫色粗线为板块学习主线</div>
<div id="detail">
  <button id="close">✕</button>
  <div id="body"></div>
</div>
<script>
const d = window.TOPOLOGY_DATA;
const PALETTE = ["#5b8def","#e8871e","#2e9e5b","#d64545","#8e24aa","#00897b","#c2185b",
                 "#6d4c41","#546e7a","#7c4dff","#f9a825","#3949ab","#00838f","#43a047","#ef6c00"];
const gColor = {};
d.groups.forEach((g, i) => gColor[g.id] = g.color || PALETTE[i % PALETTE.length]);
const lighten = (hex, a) => { const n = parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; };

/* ===== 布局：板块折叠态紧凑网格（初始清晰可读）；板块内知识点同心圆(简单近难远) ===== */
const RING_GAP = 106, STEP = 114, CENTER_R = 38;
const levelOf = diff => Math.min(10, Math.max(1, diff || 1));

function groupCircle(g, bx, by){
  const ring = {};
  g.nodes.forEach(nd => { const L = levelOf(nd.diff); (ring[L] = ring[L] || []).push(nd); });
  const rings = Object.entries(ring).map(([lv, ns]) => {
    const L = +lv, n = ns.length;
    return { L, ns, r: Math.max(RING_GAP * L, STEP / (2 * Math.sin(Math.PI / Math.max(2, n)))) };
  }).sort((a, b) => a.L - b.L);
  for (let i = 1; i < rings.length; i++)
    if (rings[i].r < rings[i - 1].r + RING_GAP) rings[i].r = rings[i - 1].r + RING_GAP;
  let maxR = 0;
  rings.forEach(({ L, ns, r }) => {
    maxR = Math.max(maxR, r);
    const off = (L % 2) * (Math.PI / ns.length);
    ns.forEach((nd, i) => {
      const th = 2 * Math.PI * i / ns.length + off;
      nd._x = bx + r * Math.cos(th);
      nd._y = by + r * Math.sin(th);
    });
  });
  return maxR + CENTER_R;
}

// 折叠态紧凑网格：初始 fit 后板块大而清晰；展开时聚焦该板块看细节
const GAP = 50, CELL = 150, COLS = 4;
d.groups.forEach((g, i) => {
  const bx = 100 + (i % COLS) * (CELL + GAP) + CELL / 2;
  const by = 100 + Math.floor(i / COLS) * (CELL + GAP) + CELL / 2;
  groupCircle(g, bx, by);
});

// ===== Cytoscape 元素 =====
const elements = [], nodeIds = new Set();
d.groups.forEach(g => {
  elements.push({ data: { id: "g-" + g.id, label: g.name, color: gColor[g.id], fill: lighten(gColor[g.id], .08), type: "group" } });
  g.nodes.forEach(nd => {
    nodeIds.add(nd.id);
    elements.push({ data: { id: nd.id, label: nd.n, parent: "g-" + g.id, color: gColor[g.id] },
      position: { x: nd._x, y: nd._y } });
  });
});
let ei = 0;
const majorPairs = new Set();
(d.edges || []).forEach(e => {
  const s = Array.isArray(e) ? e[0] : e.from, t = Array.isArray(e) ? e[1] : e.to;
  if (!nodeIds.has(s) || !nodeIds.has(t)) return;
  const sg = d.groups.find(g => g.nodes.some(n => n.id === s));
  const tg = d.groups.find(g => g.nodes.some(n => n.id === t));
  if (sg && tg && sg.id !== tg.id) majorPairs.add(sg.id + ">" + tg.id);
  elements.push({ data: { id: "e" + (ei++), source: s, target: t } });
});
let mi = 0;
majorPairs.forEach(pair => {
  const [a, b] = pair.split(">");
  elements.push({ data: { id: "m" + (mi++), source: "g-" + a, target: "g-" + b, major: true } });
});

// ===== Cytoscape 实例 =====
const cy = cytoscape({
  container: document.getElementById("cy"),
  elements,
  layout: { name: "preset" },
  wheelSensitivity: 0.15,
  minZoom: 0.02, maxZoom: 3,
  boxSelectionEnabled: false,
  style: [
    { selector: "node[type='group']:parent", style: {
      "background-color": "data(fill)", "border-color": "data(color)", "border-width": 2.5,
      "shape": "round-rectangle", "label": "data(label)", "font-size": 15, "font-weight": 700,
      "color": "data(color)", "text-valign": "center", "text-halign": "center", "padding": "26px",
      "overlay-opacity": 0 } },
    { selector: "node[type='group'].collapsed", style: {
      "background-color": "data(color)", "color": "#fff", "border-width": 0,
      "shape": "round-rectangle", "padding": "14px", "font-size": 16, "font-weight": 700,
      "text-valign": "center", "text-halign": "center", "overlay-opacity": 0 } },
    { selector: "node[type='group']:not(.collapsed):not(:parent)", style: {
      "background-color": "data(color)", "color": "#fff", "border-width": 0,
      "shape": "round-rectangle", "padding": "14px", "font-size": 16, "font-weight": 700,
      "text-valign": "center", "text-halign": "center", "overlay-opacity": 0 } },
    { selector: "node:child", style: {
      "background-color": "#ffffff", "border-color": "data(color)", "border-width": 1.5,
      "shape": "round-rectangle", "width": 96, "height": 26, "label": "data(label)",
      "font-size": 10, "color": "#1a2332", "text-valign": "center", "text-halign": "center",
      "overlay-opacity": 0 } },
    { selector: "edge", style: {
      "curve-style": "bezier", "width": 1.4, "line-color": "#c5cbd6",
      "target-arrow-shape": "triangle", "target-arrow-color": "#c5cbd6",
      "arrow-scale": 0.7, "opacity": 0.75 } },
    { selector: "edge.major", style: {
      "curve-style": "unbundled-bezier", "width": 4.5, "line-color": "#7c4dff",
      "target-arrow-shape": "triangle", "target-arrow-color": "#7c4dff",
      "arrow-scale": 1.2, "opacity": 0.95, "z-index": 10 } },
    { selector: ".dim", style: { "opacity": 0.1 } },
    { selector: ".hl", style: { "border-width": 3, "border-color": "#ffd54f", "z-index": 20 } },
  ],
});
window.cy = cy;
const expandApi = cy.expandCollapse({ animate: true, fisheye: false });
window.expandApi = expandApi;
// 初始全部折叠：只显示板块与主线
expandApi.collapseAll();
cy.fit(undefined, 60);
setTimeout(() => cy.fit(undefined, 60), 300);

document.getElementById("stats").textContent =
  `${d.name} · ${nodeIds.size} 知识点 · 10 主题 · 紫线为板块学习主线（点击板块展开）`;

// ===== 图例：点击聚焦某主题 =====
const legend = document.getElementById("legend");
d.groups.forEach(g => {
  const row = document.createElement("div");
  row.className = "lg";
  row.innerHTML = `<span class="dot" style="background:${gColor[g.id]}"></span>${g.name} (${g.nodes.length})`;
  row.onclick = () => {
    cy.elements().removeClass("dim hl");
    cy.nodes().forEach(n => n.addClass(n.data("parent") === "g-" + g.id ? "hl" : "dim"));
  };
  legend.appendChild(row);
});
legend.addEventListener("mouseleave", () => cy.elements().removeClass("dim hl"));

// ===== 点击板块：展开（聚焦） / 收起（回全貌） =====
// 折叠后板块不再满足 :parent，故用 type=group 标记识别
cy.on("tap", "node", evt => {
  const n = evt.target;
  if (n.data("type") !== "group") return;
  const api = cy.expandCollapse();
  if (n.children(":visible").length === 0){
    api.expand(n);
    setTimeout(() => {
      cy.animate({ fit: { eles: n.union(n.children()), padding: 70 }, duration: 450 });
    }, 120);
  } else {
    api.collapse(n);
    setTimeout(() => cy.fit(undefined, 60), 120);
  }
});

// ===== 悬停知识点：高亮前后置链 =====
function neighbors(id){
  const hit = new Set([id]);
  let changed = true;
  while (changed){
    changed = false;
    cy.edges().forEach(e => {
      if (e.hasClass("major")) return;
      const s = e.source().id(), t = e.target().id();
      if (hit.has(s) && !hit.has(t)){ hit.add(t); changed = true; }
      if (hit.has(t) && !hit.has(s)){ hit.add(s); changed = true; }
    });
  }
  return hit;
}
cy.on("mouseover", "node:child", evt => {
  const hit = neighbors(evt.target.id());
  cy.elements().removeClass("hl");
  cy.nodes().forEach(n => n.addClass(hit.has(n.id()) ? "hl" : "dim"));
});
cy.on("mouseout", "node:child", () => cy.elements().removeClass("dim hl"));

// ===== 点击知识点：详情 =====
cy.on("tap", "node:child", evt => {
  const id = evt.target.id();
  const nd = d.groups.flatMap(g => g.nodes).find(n => n.id === id);
  const up = [], down = [];
  cy.edges().forEach(e => {
    if (e.hasClass("major")) return;
    if (e.target().id() === id) up.push(e.source().id());
    if (e.source().id() === id) down.push(e.target().id());
  });
  const lbl = x => cy.getElementById(x).data("label");
  const rel = ids => ids.length ? ids.map(x => `<span onclick="focusNode('${x}')">${lbl(x)}</span>`).join("") : "<span>—</span>";
  document.getElementById("body").innerHTML =
    `<h2>${nd.n}</h2>
     <div class="kv"><span class="k">主题</span><span class="v">${nd.gname || ""}</span></div>
     <h3>前置（先学）</h3><div class="rel">${rel(up)}</div>
     <h3>后继（后学）</h3><div class="rel">${rel(down)}</div>`;
  document.getElementById("detail").classList.add("open");
});
window.focusNode = id => {
  cy.getElementById(id).animate({ position: cy.getElementById(id).position(), renderedPosition: undefined }, { duration: 0 });
  cy.animate({ fit: { eles: cy.getElementById(id), padding: 200 }, duration: 400 });
  cy.elements().removeClass("dim hl");
  cy.getElementById(id).addClass("hl");
  document.querySelectorAll("#body .rel span").forEach(s => {
    s.style.background = s.textContent === cy.getElementById(id).data("label") ? "#ffe08a" : "#f1f3f8";
  });
};
document.getElementById("close").onclick = () => document.getElementById("detail").classList.remove("open");
