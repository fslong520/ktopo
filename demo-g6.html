<body>
<div class="stats" id="stats"></div>
<div id="legend"><h4>主题（点击聚焦）</h4></div>
<div id="container"></div>
<div id="detail">
  <button id="close">✕</button>
  <div id="body"></div>
</div>
<script>
const d = window.TOPOLOGY_DATA;
const PALETTE = ["#5b8def","#e8871e","#2e9e5b","#d64545","#8e24aa","#00897b","#c2185b",
                 "#6d4c41","#546e7a","#7c4dff","#f9a825","#3949ab","#00838f","#43a047","#ef6c00"];
const gColor = {};
d.groups.forEach((g, i) => gColor[g.id] = g.color || PALETTE[i % PALETTE.length]);
const lighten = (hex, a) => { const n = parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; };

/* ===== 同心圆放射布局：
   板块名在圆心；节点按难度(diff)分层环布——简单的靠内圈，难的依赖多的靠外圈。
   板块之间紧凑打包；静态位置，不自动跳动。 ===== */
const STEP = 168, RING_GAP = 170, CENTER_R = 44, PACK_GAP = 240, TARGET_W = 6200;
const levelOf = diff => (diff = Math.min(10, Math.max(1, diff||1))) <= 3 ? 1 : diff <= 6 ? 2 : diff <= 8 ? 3 : 4;

function layoutGroup(g, cx, cy){
  const ring = {};
  g.nodes.forEach(n => { const lv = levelOf(n.diff); (ring[lv] = ring[lv] || []).push(n); });
  const rings = Object.entries(ring).map(([lv, ns]) => {
    const L = +lv, n = ns.length;
    return { L, ns, r: Math.max(RING_GAP * L, STEP / (2 * Math.sin(Math.PI / Math.max(2, n)))) };
  }).sort((a, b) => a.L - b.L);
  // 相邻环半径差 ≥ RING_GAP，保证任意角度下环间不重叠
  for (let i = 1; i < rings.length; i++)
    if (rings[i].r < rings[i - 1].r + RING_GAP) rings[i].r = rings[i - 1].r + RING_GAP;
  let maxR = 0;
  rings.forEach(({ L, ns, r }) => {
    maxR = Math.max(maxR, r);
    const off = (L % 2) * (Math.PI / ns.length);
    ns.forEach((nd, i) => {
      const th = 2 * Math.PI * i / ns.length + off;
      nd.x = cx + r * Math.cos(th);
      nd.y = cy + r * Math.sin(th);
    });
  });
  return maxR + CENTER_R;
}

// 板块打包：按半径降序，逐行放入（每行宽度 ≤ TARGET_W）
const groups = d.groups.map(g => ({ g, r: layoutGroup(g, 0, 0) })).sort((a, b) => b.r - a.r);
const rows = [];
let idx = 0;
while (idx < groups.length){
  const row = []; let w = 0;
  while (idx < groups.length && (row.length === 0 || w + groups[idx].r * 2 + PACK_GAP <= TARGET_W)){
    row.push(groups[idx]); w += groups[idx].r * 2 + (row.length > 1 ? PACK_GAP : 0); idx++;
  }
  rows.push(row);
}
let yy = 0;
rows.forEach(row => {
  const rowH = Math.max(...row.map(x => x.r * 2)); let xx = 0;
  row.forEach(gr => {
    const c = { x: xx + gr.r, y: yy + gr.r };
    layoutGroup(gr.g, c.x, c.y);
    gr.cx = c.x; gr.cy = c.y;
    xx += gr.r * 2 + PACK_GAP;
  });
  yy += rowH + PACK_GAP;
});

// 构建 G6 数据：中心主题节点 + 知识点节点 + 边
const nodes = [], byId = {}, centerById = {};
const grpById = {};
groups.forEach(gr => grpById[gr.g.id] = gr);
d.groups.forEach(g => {
  const c = grpById[g.id];
  const center = { id: "g-" + g.id, label: g.name, gid: g.id, isCenter: true,
    x: c.cx, y: c.cy, style: { radius: 42 }, type: "circle",
    labelCfg: { style: { fontSize: 15, fontWeight: 700, fill: "#fff" } },
    styleOverride: { fill: gColor[g.id], stroke: gColor[g.id], lineWidth: 2 } };
  nodes.push(center); centerById[g.id] = center;
  g.nodes.forEach(nd => {
    const n = { id: nd.id, label: nd.n, gid: g.id, gname: g.name, isCenter: false,
      x: nd.x, y: nd.y, type: "rect", size: [150, 34],
      style: { fill: lighten(gColor[g.id], .15), stroke: gColor[g.id], radius: 7 },
      labelCfg: { style: { fontSize: 11, fill: "#1a2332" } },
      data: nd };
    nodes.push(n); byId[nd.id] = n;
  });
});
// 真实依赖边
const realEdges = [];
(d.edges || []).forEach(e => {
  const s = Array.isArray(e) ? e[0] : e.from, t = Array.isArray(e) ? e[1] : e.to;
  if (byId[s] && byId[t]) realEdges.push({ source: s, target: t });
});

// 辐射辅助边（虚线，非真实依赖）：圆心 → 最内层；每层未连下层的节点 → 下一层角度最近节点
const bridgeEdges = [];
d.groups.forEach(g => {
  const gid = g.id, c = grpById[gid];
  const ns = g.nodes.map(nd => byId[nd.id]);
  const lv = {};
  ns.forEach(n => { const L = levelOf(n.data.diff); (lv[L] = lv[L] || []).push(n); });
  const levels = Object.keys(lv).map(Number).sort((a, b) => a - b);
  // 圆心 → 最内层所有节点
  lv[levels[0]].forEach(n =>
    bridgeEdges.push({ source: "g-" + gid, target: n.id, kind: "radial", gid }));
  // 逐层：无真实出边到下一层的节点，补连到下一层角度最近者
  for (let k = 0; k < levels.length - 1; k++){
    const L = levels[k], from = lv[L], to = lv[levels[k + 1]];
    const toAng = to.map(t => Math.atan2(t.y - c.cy, t.x - c.cx));
    from.forEach(f => {
      const has = realEdges.some(e => e.source === f.id && to.some(t => t.id === e.target));
      if (has) return;
      const fa = Math.atan2(f.y - c.cy, f.x - c.cx);
      let best = 0, bd = 1e9;
      to.forEach((t, i) => {
        let d = Math.abs(toAng[i] - fa); if (d > Math.PI) d = 2 * Math.PI - d;
        if (d < bd){ bd = d; best = i; }
      });
      bridgeEdges.push({ source: f.id, target: to[best].id, kind: "layer", gid });
    });
  }
});
const allEdges = realEdges.map(e => ({ ...e })).concat(bridgeEdges.map(e => ({
  ...e,
  style: {
    stroke: gColor[e.gid], lineWidth: 1,
    lineDash: e.kind === "radial" ? [6, 5] : [3, 4],
    strokeOpacity: e.kind === "radial" ? 0.55 : 0.35,
    endArrow: false,
  },
})));

const graph = new G6.Graph({
  container: "container",
  width: window.innerWidth, height: window.innerHeight,
  fitView: true,
  fitViewPadding: [50, 50, 50, 50],
  modes: { default: ["drag-canvas", "zoom-canvas", "drag-node"] },
  defaultEdge: {
    type: "line",
    style: { stroke: "#aeb6c4", lineWidth: 1.2, endArrow: { path: G6.Arrow.triangle(7, 5, 0), fill: "#aeb6c4" } },
  },
  nodeStateStyles: { dim: { opacity: 0.12 } },
  // 不设 layout —— 使用上面的固定位置，静止不跳
});
graph.data({ nodes, edges: allEdges });
graph.render();
window.graph = graph;

document.getElementById("stats").textContent =
  `${d.name} · ${nodes.length - 10} 知识点 · ${realEdges.length} 依赖边 · 虚线为分层辐射辅助线`;

// 图例：点击聚焦某主题
const legend = document.getElementById("legend");
d.groups.forEach(g => {
  const row = document.createElement("div");
  row.className = "lg";
  row.innerHTML = `<span class="dot" style="background:${gColor[g.id]}"></span>${g.name} (${g.nodes.length})`;
  row.onclick = () => {
    graph.getNodes().forEach(n => graph.setItemState(n, "dim", n.getModel().gid !== g.id));
  };
  legend.appendChild(row);
});
legend.addEventListener("mouseleave", () => graph.getNodes().forEach(n => graph.setItemState(n, "dim", false)));

// 悬停：普通节点高亮前后置链（含辅助辐射边）；中心节点高亮该主题全部节点
function neighbors(id){
  const hit = new Set([id]);
  let changed = true;
  while (changed){
    changed = false;
    allEdges.forEach(e => {
      if (hit.has(e.source) && !hit.has(e.target)){ hit.add(e.target); changed = true; }
      if (hit.has(e.target) && !hit.has(e.source)){ hit.add(e.source); changed = true; }
    });
  }
  return hit;
}
graph.on("node:mouseenter", e => {
  const m = e.item.getModel();
  if (m.isCenter){
    graph.getNodes().forEach(n => graph.setItemState(n, "dim", n.getModel().gid !== m.gid));
  } else {
    const hit = neighbors(m.id);
    graph.getNodes().forEach(n => graph.setItemState(n, "dim", !hit.has(n.getModel().id)));
  }
});
graph.on("node:mouseleave", () => graph.getNodes().forEach(n => graph.setItemState(n, "dim", false)));

// 点击：知识点显示详情；中心显示主题概览
function showDetailHTML(nd){
  const up = [], down = [];
  realEdges.forEach(e2 => { if (e2.target === nd.id) up.push(e2.source); if (e2.source === nd.id) down.push(e2.target); });
  const rel = (ids) => ids.length ? ids.map(id => `<span onclick="focusNode('${id}')">${byId[id].label}</span>`).join("") : "<span>—</span>";
  return `<h2>${nd.n}</h2>
    <div class="kv"><span class="k">主题</span><span class="v">${nd.gname || ""}</span></div>
    <h3>前置（先学）</h3><div class="rel">${rel(up)}</div>
    <h3>后继（后学）</h3><div class="rel">${rel(down)}</div>`;
}
graph.on("node:click", e => {
  const m = e.item.getModel();
  let h;
  if (m.isCenter){
    const list = nodes.filter(n => n.gid === m.gid && !n.isCenter);
    h = `<h2>${m.label}</h2>
      <div class="kv"><span class="k">主题</span><span class="v">${list.length} 个知识点</span></div>
      <h3>知识点</h3><div class="rel">${list.map(n => `<span onclick="focusNode('${n.id}')">${n.label}</span>`).join("")}</div>`;
  } else {
    h = showDetailHTML(m.data);
  }
  document.getElementById("body").innerHTML = h;
  document.getElementById("detail").classList.add("open");
});
window.focusNode = id => {
  graph.focusItem(id, true, { duration: 400 });
  graph.getNodes().forEach(n => graph.setItemState(n, "dim", n.getModel().id !== id));
  document.querySelectorAll("#body .rel span").forEach(s => {
    s.style.background = s.textContent === byId[id].label ? "#ffe08a" : "#f1f3f8";
  });
};
document.getElementById("close").onclick = () => document.getElementById("detail").classList.remove("open");

window.addEventListener("resize", () => {
  graph.changeSize(window.innerWidth, window.innerHeight);
  graph.fitView([50, 50, 50, 50]);
});
</script>
</body>
</html>
