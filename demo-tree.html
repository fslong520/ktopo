  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;height:100vh;display:flex;}
  #sidebar{flex:0 0 220px;background:#fff;border-right:1px solid #e2e6ee;overflow-y:auto;padding:14px 10px;z-index:5;}
  #sidebar h3{font-size:13px;color:#888;margin:0 8px 10px;}
  #sidebar .gitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;
    font-size:13px;color:#1a2332;transition:background .15s;margin-bottom:2px;}
  #sidebar .gitem:hover{background:#f2f4f9;}
  #sidebar .gitem.active{background:#eef1fb;font-weight:600;}
  #sidebar .gitem .dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}
  #sidebar .gitem small{margin-left:auto;color:#aab;font-size:11px;}
  #cy{flex:1;background:radial-gradient(circle at 1px 1px,#e3e7ee 1px,transparent 1px) 0 0/22px 22px,#f7f8fa;}
  .stats{position:fixed;left:238px;top:12px;background:rgba(255,255,255,.94);border:1px solid #e2e6ee;
    border-radius:10px;padding:6px 12px;font-size:12px;color:#6b7686;z-index:6;box-shadow:0 2px 10px rgba(0,0,0,.06);}
  #detail{position:fixed;right:0;top:0;bottom:0;width:290px;background:#fff;border-left:1px solid #e2e6ee;
    box-shadow:-3px 0 12px rgba(0,0,0,.07);padding:18px 16px;overflow:auto;transform:translateX(105%);
    transition:transform .25s;z-index:10;}
  #detail.open{transform:translateX(0);}
  #detail h2{font-size:15px;margin-bottom:10px;}
  #detail .kv{display:flex;gap:8px;margin:6px 0;font-size:13px;}
  #detail .k{flex:0 0 50px;color:#888;}
  #detail h3{font-size:12px;color:#888;margin:14px 0 6px;border-left:3px solid #7c4dff;padding-left:6px;}
  #detail .rel{display:flex;flex-wrap:wrap;gap:5px;}
  #detail .rel span{background:#f1f3f8;border-radius:5px;padding:2px 7px;font-size:11px;cursor:pointer;}
  #close{position:absolute;top:12px;right:14px;border:none;background:none;font-size:16px;cursor:pointer;color:#888;}
</style>

<script>
"use strict";
/* ===== 主逻辑 ===== */
const d = window.TOPOLOGY_DATA;
const PALETTE = ["#5b8def","#e8871e","#2e9e5b","#d64545","#8e24aa","#00897b","#c2185b",
                 "#6d4c41","#546e7a","#7c4dff","#f9a825","#3949ab","#00838f","#43a047","#ef6c00"];
const gColor = {};
d.groups.forEach((g, i) => gColor[g.id] = g.color || PALETTE[i % PALETTE.length]);

// 左侧板块导航
const glist = document.getElementById("glist");
let activeId = null;
d.groups.forEach(g => {
  const btn = document.createElement("div");
  btn.className = "gitem";
  btn.innerHTML = `<span class="dot" style="background:${gColor[g.id]}"></span>${g.name}<small>${g.nodes.length}</small>`;
  btn.onclick = () => showGroup(g.id);
  glist.appendChild(btn);
});

let cy = null;
function showGroup(gid){
  activeId = gid;
  const idx = d.groups.findIndex(g => g.id === gid);
  [...glist.children].forEach(el => el.classList.remove("active"));
  glist.children[idx].classList.add("active");
  const g = d.groups[idx];
  const ids = new Set(g.nodes.map(n => n.id));
  // 计算依赖深度（前置链长度，环保护）——思维导图按深度渐变着色
  const ins = {}; ids.forEach(id => ins[id] = []);
  const intraEdges = [];
  (d.edges || []).forEach(e => {
    const s = Array.isArray(e) ? e[0] : e.from, t = Array.isArray(e) ? e[1] : e.to;
    if (ids.has(s) && ids.has(t)){ intraEdges.push([s, t]); ins[t].push(s); }
  });
  const depth = {};
  const calcD = (id, vis) => {
    if (vis.has(id)) return 0;
    if (depth[id] !== undefined) return depth[id];
    vis.add(id);
    depth[id] = ins[id].length ? Math.max(...ins[id].map(p => calcD(p, vis))) + 1 : 0;
    vis.delete(id);
    return depth[id];
  };
  g.nodes.forEach(n => calcD(n.id, new Set()));
  const maxD = Math.max(...g.nodes.map(n => depth[n.id]));
  // 思维导图着色：并列根深色 → 叶子浅色
  const fill = (hex, dp) => {
    const r = maxD > 0 ? dp / maxD * 0.6 : 0;
    const n = parseInt(hex.slice(1), 16);
    const mix = c => Math.round(c + (255 - c) * r);
    return `rgb(${mix((n >> 16) & 255)},${mix((n >> 8) & 255)},${mix(n & 255)})`;
  };
  const elements = [];
  // 板块名 = 思维导图根节点
  elements.push({ data: { id: "root-" + g.id, label: g.name, color: gColor[g.id], isRoot: true } });
  g.nodes.forEach(nd => elements.push({
    data: { id: nd.id, label: nd.n, color: gColor[g.id], fill: fill(gColor[g.id], depth[nd.id]) }
  }));
  let eid = 0;
  // 根节点 → 并列根知识点（深度0）
  g.nodes.forEach(nd => { if (depth[nd.id] === 0) elements.push({ data: { id: "re" + (eid++), source: "root-" + g.id, target: nd.id, isRootEdge: true, color: gColor[g.id] } }); });
  // 组内依赖边
  intraEdges.forEach(([s, t]) => elements.push({ data: { id: "e" + (eid++), source: s, target: t } }));
  if (cy) cy.destroy();
  cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    layout: { name: "dagre", rankDir: "TB", nodesep: 26, ranksep: 115, padding: 40 },
    wheelSensitivity: 0.2, minZoom: 0.02, maxZoom: 3, boxSelectionEnabled: false,
    style: [
      { selector: "node", style: {
        "background-color": "data(fill)", "border-color": "data(color)", "border-width": 1.8,
        "shape": "round-rectangle", "width": 128, "height": 34, "label": "data(label)",
        "font-size": 12, "color": "#1a2332", "text-valign": "center", "text-halign": "center",
        "overlay-opacity": 0 } },
      { selector: "node[isRoot='true']", style: {
        "background-color": "data(color)", "color": "#fff", "font-size": 17, "font-weight": 700,
        "shape": "round-rectangle", "width": 168, "height": 42, "border-width": 0,
        "text-valign": "center", "text-halign": "center", "overlay-opacity": 0 } },
      { selector: "edge", style: {
        "curve-style": "bezier", "width": 1.7, "line-color": "#c9cfd9",
        "target-arrow-shape": "none", "opacity": 0.75 } },
      { selector: "edge[isRootEdge='true']", style: {
        "curve-style": "bezier", "width": 2.4, "line-color": "data(color)", "opacity": 0.9 } },
      { selector: ".dim", style: { "opacity": 0.12 } },
      { selector: ".hl", style: { "border-width": 3.5, "border-color": "#ffd54f", "z-index": 20 } },
    ],
  });
  cy.fit(undefined, 50);
  window.cy = cy; // 便于调试与外部扩展
  document.getElementById("stats").textContent =
    `${g.name} · ${g.nodes.length} 知识点 · ${intraEdges.length} 依赖边`;
  bindInteractions();
}

// 交互：悬停高亮前后置链、点击详情
function bindInteractions(){
  cy.on("mouseover", "node", evt => {
    const n = evt.target;
    if (n.data("isRoot")){ cy.elements().removeClass("dim hl"); return; }
    const hit = neighbors(n.id());
    cy.elements().removeClass("hl");
    cy.nodes().forEach(x => x.addClass(hit.has(x.id()) ? "hl" : "dim"));
  });
  cy.on("mouseout", "node", () => cy.elements().removeClass("dim hl"));
  cy.on("tap", "node", evt => {
    const n = evt.target;
    if (!n.data("isRoot")) showDetail(n.id());
  });
}
function neighbors(id){
  const hit = new Set([id]);
  let changed = true;
  while (changed){
    changed = false;
    cy.edges().forEach(e => {
      const s = e.source().id(), t = e.target().id();
      if (hit.has(s) && !hit.has(t)){ hit.add(t); changed = true; }
      if (hit.has(t) && !hit.has(s)){ hit.add(s); changed = true; }
    });
  }
  return hit;
}
function showDetail(id){
  const g = d.groups.find(x => x.id === activeId);
  const nd = g.nodes.find(n => n.id === id);
  const up = [], down = [];
  cy.edges().forEach(e => {
    if (e.target().id() === id) up.push(e.source().id());
    if (e.source().id() === id) down.push(e.target().id());
  });
  const lbl = x => cy.getElementById(x).data("label");
  const rel = xs => xs.length ? xs.map(x => `<span onclick="jump('${x}')">${lbl(x)}</span>`).join("") : "<span>—</span>";
  document.getElementById("body").innerHTML =
    `<h2>${nd.n}</h2>
     <div class="kv"><span class="k">主题</span><span class="v">${g.name}</span></div>
     <div class="kv"><span class="k">难度</span><span class="v">${nd.diff || ""}</span></div>
     <h3>前置（先学）</h3><div class="rel">${rel(up)}</div>
     <h3>后继（后学）</h3><div class="rel">${rel(down)}</div>`;
  document.getElementById("detail").classList.add("open");
}
window.jump = id => {
  cy.getElementById(id).addClass("hl");
  cy.animate({ fit: { eles: cy.getElementById(id), padding: 180 }, duration: 400 });
  document.querySelectorAll("#body .rel span").forEach(s => {
    s.style.background = s.textContent === cy.getElementById(id).data("label") ? "#ffe08a" : "#f1f3f8";
  });
};
document.getElementById("close").onclick = () => document.getElementById("detail").classList.remove("open");

showGroup(d.groups[0].id);
</script>
