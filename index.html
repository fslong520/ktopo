<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识拓扑图 · Knowledge Topology</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#fff; --line:#dde1e6; --text:#1a2332; --muted:#6b7686;
    --accent:#4a6cf7; --cross:#7c4dff; --hl:#ffd54f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--text); overflow:hidden;}
  #app{display:flex; flex-direction:column; height:100vh;}

  header{flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--line);
         padding:8px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  header h1{font-size:17px; font-weight:700; white-space:nowrap;}
  header h1 small{font-size:11px; color:var(--muted); font-weight:400; margin-left:8px;}
  header select{padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:13px;
                background:#fff; outline:none; max-width:200px;}
  .search{flex:0 0 200px;}
  .search input{width:100%; padding:6px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; outline:none;}
  .search input:focus{border-color:var(--accent);}
  #filters{display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--muted);}
  #filters .fg{display:flex; align-items:center; gap:6px;}
  #filters .fg .fl{font-weight:600; color:var(--text);}
  #filters label{display:flex; align-items:center; gap:3px; cursor:pointer;}
  #filters .chk{width:14px; height:14px; accent-color:var(--accent);}
  #filters input[type=range]{width:80px; accent-color:var(--accent);}
  #fitbtn{border:1px solid var(--line); background:#fff; color:var(--text); font-size:12px;
          padding:4px 10px; border-radius:6px; cursor:pointer;}
  #fitbtn:hover{border-color:var(--accent);}
  .stats{margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap;}
  .stats b{color:var(--text);}

  #view{flex:1 1 auto; position:relative; overflow:hidden; background:
    radial-gradient(circle at 1px 1px, #e3e7ee 1px, transparent 1px) 0 0/22px 22px;}
  svg{display:block; width:100%; height:100%; cursor:grab;}
  svg.panning{cursor:grabbing;}
  .node{cursor:grab;}
  .node.dragging{cursor:grabbing;}
  .node rect{fill:var(--panel); stroke-width:1.4; transition:opacity .18s;}
  .node text.nm{font-size:11px; fill:var(--text); pointer-events:none; user-select:none;}
  .node text.df{font-size:9px; fill:#fff; font-weight:700; pointer-events:none; text-anchor:middle;}
  .node circle.df{stroke:#fff; stroke-width:1;}
  .node:hover rect{stroke-width:2.2;}
  .edge{stroke-width:1.2; transition:opacity .18s;}
  .edge.intra{stroke:#aeb6c4; opacity:.55;}
  .edge.cross{stroke:var(--cross); opacity:.85; stroke-width:1.6;}
  .node.hit rect{stroke:var(--hl) !important; stroke-width:2.8;}
  .node.self rect{stroke-width:2.8;}
  .mute .node:not(.on), .mute .edge:not(.on){opacity:.13;}
  .on .edge.on{opacity:1;}
  .glabel{font-size:13px; font-weight:700; fill:var(--muted); pointer-events:none; opacity:.9;}
  .gbox{stroke-width:1.4; pointer-events:none; stroke-opacity:.55;}

  aside{position:absolute; right:0; top:0; bottom:0; width:280px; background:var(--panel);
        border-left:1px solid var(--line); box-shadow:-4px 0 12px rgba(0,0,0,.06);
        transform:translateX(100%); transition:transform .22s ease; z-index:20; overflow-y:auto;}
  aside.open{transform:translateX(0);}
  aside .head{padding:14px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  aside .head h2{font-size:14px;}
  aside .close{cursor:pointer; color:var(--muted); font-size:16px; border:none; background:none;}
  aside .body{padding:14px 16px; font-size:13px;}
  aside .body .kv{display:flex; gap:8px; margin:7px 0; align-items:baseline;}
  aside .body .k{flex:0 0 56px; color:var(--muted); font-size:12px;}
  aside .body .v{flex:1; word-break:break-all;}
  aside h3{font-size:12px; color:var(--muted); margin:14px 0 6px; border-left:3px solid var(--cross); padding-left:6px;}
  aside .rel{display:flex; flex-wrap:wrap; gap:5px;}
  aside .rel span{background:#f1f3f8; border-radius:4px; padding:2px 7px; font-size:11px; cursor:pointer;}
  aside .rel span:hover{background:#e2e7f5;}
  aside a{color:var(--accent); text-decoration:none;}
  aside a:hover{text-decoration:underline;}
  .hint{position:absolute; left:16px; bottom:14px; background:rgba(255,255,255,.92); border:1px solid var(--line);
        border-radius:8px; padding:8px 12px; font-size:12px; color:var(--muted); z-index:10; line-height:1.7;}
  .hint b{color:var(--text);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>知识拓扑图<small>把知识间的前后关系画成可拖拽的图</small></h1>
    <select id="setsel" title="切换知识集"></select>
    <div class="search"><input id="q" type="text" placeholder="搜索知识点…"></div>
    <div id="filters"></div>
    <button id="fitbtn">适应视图</button>
    <div class="stats" id="stats"></div>
  </header>
  <div id="view">
    <svg id="svg"></svg>
    <aside id="aside">
      <div class="head"><h2>知识点详情</h2><button class="close" onclick="closeDetail()">✕</button></div>
      <div class="body" id="detail"></div>
    </aside>
    <div class="hint"><b>拖拽</b>节点任意摆放 &nbsp;|&nbsp; <b>悬停</b>看前后置链 &nbsp;|&nbsp; <b>点击</b>看详情<br><b>空白拖拽</b>平移 &nbsp;|&nbsp; <b>滚轮</b>缩放</div>
  </div>
</div>

<script src="data/index.js"></script>
<script>
"use strict";
/* ================= 常量 ================= */
const SVG = document.getElementById("svg"), VIEW = document.getElementById("view");
const NS = "http://www.w3.org/2000/svg";
const NODE_W = 150, NODE_H = 34;
const PALETTE = ["#5b8def","#e8871e","#2e9e5b","#d64545","#8e24aa","#00897b","#c2185b",
                 "#6d4c41","#546e7a","#7c4dff","#f9a825","#3949ab","#00838f","#43a047","#ef6c00"];
// 静态布局参数：每行节点数、列距、行距、顶距、组间距
const LAY = { COLS: 16, CW: 170, RH: 58, TOP: 90, GAP: 64 };

/* ================= 全局状态 ================= */
let DATA = null, NODES = [], EDGES = [], nodeById = {}, groupColor = {};
let scale = 1, tx = 0, ty = 0;
let panBg = null, dragNode = null, suppressClick = false, moved = 0;
let filterState = {};

const el = (t, a = {}, parent) => {
  const e = document.createElementNS(NS, t);
  for (const k in a){
    if (k === "textContent") e.textContent = a[k];
    else e.setAttribute(k, a[k]);
  }
  if (parent) parent.appendChild(e);
  return e;
};
const lighten = hex => {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},.12)`;
};

/* ================= 数据加载 ================= */
function loadSets(){
  const sel = document.getElementById("setsel");
  (window.TOPOLOGY_SETS || []).forEach(s => {
    const o = document.createElement("option");
    o.value = s.file; o.textContent = s.name;
    sel.appendChild(o);
  });
  sel.addEventListener("change", () => loadSet(sel.value));
  if (sel.options.length) loadSet(sel.value);
}
function loadSet(file){
  const old = document.getElementById("dynscript"); if (old) old.remove();
  window.TOPOLOGY_DATA = null;
  const s = document.createElement("script");
  s.id = "dynscript";
  s.src = "data/" + file;
  s.onload = () => { if (window.TOPOLOGY_DATA) init(window.TOPOLOGY_DATA); else alert("数据文件加载失败：" + file); };
  s.onerror = () => alert("数据文件不存在：" + file);
  document.body.appendChild(s);
}

/* ================= 数据归一化 ================= */
function normalize(d){
  DATA = d; NODES = []; EDGES = []; nodeById = {}; groupColor = {};
  let gi = 0;
  if (Array.isArray(d.groups)){
    d.groups.forEach(g => {
      const c = g.color || PALETTE[gi++ % PALETTE.length];
      groupColor[g.id] = c;
      (g.nodes || []).forEach(nd => {
        nd.gid = g.id; nd.gname = g.name; nd.gc = c;
        NODES.push(nd); nodeById[nd.id] = nd;
      });
    });
  }
  (d.nodes || []).forEach(nd => { NODES.push(nd); nodeById[nd.id] = nd; });
  (d.edges || []).forEach(e => {
    const f = Array.isArray(e) ? e[0] : e.from, t = Array.isArray(e) ? e[1] : e.to;
    if (nodeById[f] && nodeById[t])
      EDGES.push({ from: f, to: t, a: nodeById[f], b: nodeById[t],
                   cross: !!(nodeById[f].gid && nodeById[t].gid && nodeById[f].gid !== nodeById[t].gid) });
  });
}
function initLayout(){
  // 静态固定布局：节点放置后不再自动移动，拖到哪停在哪。
  // 有分组时：每组占连续行，组内节点按行横排（学习顺序），组间留空行分隔；
  // 无分组时：全部节点统一网格排布。
  const { COLS, CW, RH, TOP, GAP } = LAY;
  if (DATA.groups){
    let y = TOP;
    DATA.groups.forEach(g => {
      const nodes = g.nodes || [];
      const rows = Math.max(1, Math.ceil(nodes.length / COLS));
      nodes.forEach((nd, i) => {
        nd.x = 120 + (i % COLS) * CW;
        nd.y = y + Math.floor(i / COLS) * RH;
      });
      y += rows * RH + GAP;
    });
  } else {
    NODES.forEach((nd, i) => {
      nd.x = 120 + (i % COLS) * CW;
      nd.y = TOP + Math.floor(i / COLS) * RH;
    });
  }
}

/* ================= 渲染 ================= */
function build(){
  SVG.innerHTML = "";
  const defs = el("defs", {}, SVG);
  [[ "arrIntra", "#aeb6c4" ], [ "arrCross", "#7c4dff" ]].forEach(([id, col]) => {
    const m = el("marker", { id, viewBox: "0 0 10 10", refX: 8.5, refY: 5,
      markerWidth: 6, markerHeight: 6, orient: "auto" }, defs);
    el("path", { d: "M0,0 L10,5 L0,10 z", fill: col }, m);
  });
  // 分组背景色块（最底层，主题分区）
  DATA.groups && DATA.groups.forEach(g => {
    const c = g.nodes[0] && g.nodes[0].gc || "#5b8def";
    g.bg = el("rect", { class: "gbox", rx: 12, fill: lighten(c), stroke: c }, SVG);
  });
  // 边
  EDGES.forEach(e => {
    e.line = el("line", { class: "edge " + (e.cross ? "cross" : "intra"),
      "marker-end": "url(#" + (e.cross ? "arrCross" : "arrIntra") + ")" }, SVG);
  });
  // 节点
  NODES.forEach(nd => {
    const g = el("g", { class: "node", id: "n-" + nd.id }, SVG);
    const c = nd.gc || "#5b8def";
    nd.rect = el("rect", { width: NODE_W, height: NODE_H, rx: 7,
      stroke: c, fill: nd.gc ? lighten(c) : "#fff" }, g);
    el("text", { class: "nm", x: NODE_W / 2, y: NODE_H / 2 + 4, "text-anchor": "middle",
      "textContent": nd.n }, g);
    // 徽章（badge 指定的属性）
    if (DATA.badge && nd[DATA.badge.key] !== undefined){
      const v = nd[DATA.badge.key];
      const col = (typeof v === "number" && v >= 1 && v <= 10)
        ? (v <= 3 ? "#43a047" : v <= 6 ? "#fb8c00" : v <= 8 ? "#e53935" : "#8e24aa")
        : c;
      el("circle", { class: "df", cx: NODE_W - 10, cy: 10, r: 8, fill: col }, g);
      el("text", { class: "df", x: NODE_W - 10, y: 13, "textContent": v }, g);
    }
    g.addEventListener("mousedown", ev => startNodeDrag(ev, nd));
    g.addEventListener("mouseenter", () => highlight(nd.id));
    g.addEventListener("mouseleave", () => { if (!pinned) clearHighlight(); });
    g.addEventListener("click", () => {
      if (suppressClick){ suppressClick = false; return; }
      togglePin(nd.id);
    });
    nd.g = g;
    g.setAttribute("transform", "translate(0,0)");
  });
  // 分组标签（跟随组内节点平均位置）
  DATA.groups && DATA.groups.forEach(g => {
    g.lbl = el("text", { class: "glabel", "text-anchor": "middle" }, SVG);
    g.lbl.textContent = g.name;
  });
}
function updateDOM(){
  NODES.forEach(nd => {
    nd.g.setAttribute("transform",
      `translate(${nd.x - NODE_W / 2},${nd.y - NODE_H / 2})`);
  });
  EDGES.forEach(e => {
    const a = e.a, b = e.b;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;
    e.line.setAttribute("x1", a.x + ux * (NODE_W / 2 - 4));
    e.line.setAttribute("y1", a.y + uy * (NODE_H / 2 - 4));
    e.line.setAttribute("x2", b.x - ux * (NODE_W / 2 - 2));
    e.line.setAttribute("y2", b.y - uy * (NODE_H / 2 - 2));
  });
  DATA.groups && DATA.groups.forEach(g => {
    if (!g.nodes || !g.nodes.length) return;
    let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
    g.nodes.forEach(nd => {
      x1 = Math.min(x1, nd.x - NODE_W / 2); y1 = Math.min(y1, nd.y - NODE_H / 2);
      x2 = Math.max(x2, nd.x + NODE_W / 2); y2 = Math.max(y2, nd.y + NODE_H / 2);
    });
    const pad = 16;
    g.bg.setAttribute("x", x1 - pad);
    g.bg.setAttribute("y", y1 - pad);
    g.bg.setAttribute("width", (x2 - x1) + pad * 2);
    g.bg.setAttribute("height", (y2 - y1) + pad * 2);
    g.lbl.setAttribute("x", (x1 + x2) / 2);
    g.lbl.setAttribute("y", y1 - pad - 8);
  });
}

/* ================= 拖拽 / 平移 / 缩放 ================= */
const toSvg = (px, py) => ({ x: (px - tx) / scale, y: (py - ty) / scale });
function applyView(){
  SVG.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  SVG.style.transformOrigin = "0 0";
}
function fit(){
  if (!NODES.length) return;
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  NODES.forEach(nd => {
    minX = Math.min(minX, nd.x - NODE_W / 2); minY = Math.min(minY, nd.y - NODE_H / 2);
    maxX = Math.max(maxX, nd.x + NODE_W / 2); maxY = Math.max(maxY, nd.y + NODE_H / 2);
  });
  const bw = maxX - minX, bh = maxY - minY;
  const vw = VIEW.clientWidth, vh = VIEW.clientHeight;
  scale = Math.max(0.05, Math.min(vw / bw, vh / bh, 1.1) * 0.94);
  tx = (vw - bw * scale) / 2 - minX * scale;
  ty = (vh - bh * scale) / 2 - minY * scale;
  applyView();
}
function startNodeDrag(ev, nd){
  ev.stopPropagation();
  dragNode = nd; moved = 0;
  SVG.classList.add("panning"); nd.g.classList.add("dragging");
  const p = toSvg(ev.clientX, ev.clientY);
  dragNode._ox = p.x - nd.x; dragNode._oy = p.y - nd.y;
}
window.addEventListener("mousemove", ev => {
  if (dragNode){
    const p = toSvg(ev.clientX, ev.clientY);
    dragNode.x = p.x - dragNode._ox;
    dragNode.y = p.y - dragNode._oy;
    moved += Math.hypot(ev.movementX, ev.movementY);
    updateDOM();
  } else if (panBg){
    tx += ev.clientX - panBg.x; ty += ev.clientY - panBg.y;
    panBg = { x: ev.clientX, y: ev.clientY };
    applyView();
  }
});
window.addEventListener("mouseup", () => {
  if (dragNode){
    if (moved > 4) suppressClick = true;
    dragNode = null;
    SVG.classList.remove("panning");
    NODES.forEach(n => n.g.classList.remove("dragging"));
  }
  panBg = null;
});
SVG.addEventListener("mousedown", ev => { panBg = { x: ev.clientX, y: ev.clientY }; SVG.classList.add("panning"); });
SVG.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = SVG.getBoundingClientRect();
  const px = ev.clientX - r.left, py = ev.clientY - r.top;
  const ns = Math.min(3, Math.max(0.06, scale * (ev.deltaY < 0 ? 1.12 : 0.89)));
  const k = ns / scale;
  tx = px - (px - tx) * k; ty = py - (py - ty) * k;
  scale = ns; applyView();
}, { passive: false });
document.getElementById("fitbtn").addEventListener("click", fit);

/* ================= 高亮链 / 详情 ================= */
const IN = {}, OUT = {};
function buildAdj(){
  for (const k in IN) delete IN[k];
  for (const k in OUT) delete OUT[k];
  EDGES.forEach(e => {
    (OUT[e.from] = OUT[e.from] || []).push(e.to);
    (IN[e.to] = IN[e.to] || []).push(e.from);
  });
}
let pinned = null;
function chain(id){
  const up = new Set(), down = new Set();
  let st = [id];
  while (st.length){ const c = st.pop(); (IN[c] || []).forEach(n => { if (!up.has(n)){ up.add(n); st.push(n); } }); }
  st = [id];
  while (st.length){ const c = st.pop(); (OUT[c] || []).forEach(n => { if (!down.has(n)){ down.add(n); st.push(n); } }); }
  return { up, down };
}
function highlight(id){
  clearHighlight();
  const { up, down } = chain(id);
  const hit = new Set([...up, ...down, id]);
  SVG.classList.add("mute");
  NODES.forEach(nd => {
    if (hit.has(nd.id)){
      nd.g.classList.add("on");
      if (nd.id === id) nd.g.classList.add("self");
      const c = up.has(nd.id) ? "#7c4dff" : down.has(nd.id) ? "#2e9e5b" : (nd.gc || "#5b8def");
      nd.rect.setAttribute("stroke", c);
    }
  });
  EDGES.forEach(e => { if (hit.has(e.from) && hit.has(e.to)) e.line.classList.add("on"); });
}
function clearHighlight(){
  SVG.classList.remove("mute");
  NODES.forEach(nd => {
    nd.g.classList.remove("on", "self");
    nd.rect.setAttribute("stroke", nd.gc || "#5b8def");
  });
  EDGES.forEach(e => e.line.classList.remove("on"));
}
function togglePin(id){
  pinned = (pinned === id) ? null : id;
  if (pinned){ highlight(pinned); showDetail(pinned); } else { clearHighlight(); closeDetail(); }
}
function showDetail(id){
  const nd = nodeById[id];
  const up = [], down = [];
  EDGES.forEach(e => { if (e.to === id) up.push(e.a); if (e.from === id) down.push(e.b); });
  let h = `<div class="kv"><span class="k">名称</span><span class="v"><b>${nd.n}</b></span></div>`;
  if (nd.gname) h += `<div class="kv"><span class="k">主题</span><span class="v">${nd.gname}</span></div>`;
  for (const k in nd){
    if (["id","n","gid","gname","gc","x","y","vx","vy","fixed","_ox","_oy","g","rect"].includes(k)) continue;
    const v = nd[k];
    if (k === "url" || k === "link")
      h += `<div class="kv"><span class="k">链接</span><span class="v"><a href="${v}" target="_blank">${v} ↗</a></span></div>`;
    else if (v !== undefined && v !== null && typeof v !== "object")
      h += `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  }
  h += `<h3>先学/先看它（前置）</h3><div class="rel">${up.length ? up.map(x => `<span onclick="togglePin('${x.id}')">${x.n}</span>`).join("") : "<span>—</span>"}</div>`;
  h += `<h3>然后可学/可看（后继）</h3><div class="rel">${down.length ? down.map(x => `<span onclick="togglePin('${x.id}')">${x.n}</span>`).join("") : "<span>—</span>"}</div>`;
  document.getElementById("detail").innerHTML = h;
  document.getElementById("aside").classList.add("open");
}
function closeDetail(){ document.getElementById("aside").classList.remove("open"); }

/* ================= 筛选（动态生成）/ 搜索 ================= */
function buildFiltersUI(){
  const box = document.getElementById("filters");
  box.innerHTML = "";
  filterState = {};
  (DATA.filters || []).forEach(f => {
    const fg = document.createElement("span");
    fg.className = "fg";
    const fl = document.createElement("span"); fl.className = "fl"; fl.textContent = f.name;
    fg.appendChild(fl);
    if (f.type === "multi"){
      filterState[f.key] = { mode: "multi", sel: new Set(f.options.map(o => o.v)) };
      f.options.forEach(o => {
        const lab = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.className = "chk"; cb.checked = true;
        cb.style.accentColor = o.color || "#4a6cf7";
        cb.addEventListener("change", () => {
          if (cb.checked) filterState[f.key].sel.add(o.v);
          else filterState[f.key].sel.delete(o.v);
          applyFilter();
        });
        lab.appendChild(cb);
        lab.appendChild(document.createTextNode(o.label));
        fg.appendChild(lab);
      });
    } else if (f.type === "range"){
      filterState[f.key] = { mode: "range", max: f.max };
      const r = document.createElement("input");
      r.type = "range"; r.min = f.min; r.max = f.max; r.value = f.max;
      const vspan = document.createElement("span");
      vspan.textContent = "≤" + f.max;
      r.addEventListener("input", () => {
        filterState[f.key].max = +r.value;
        vspan.textContent = "≤" + r.value;
        applyFilter();
      });
      fg.appendChild(vspan); fg.appendChild(r);
    }
    box.appendChild(fg);
  });
}
function passFilter(nd){
  for (const key in filterState){
    const f = filterState[key];
    if (f.mode === "multi"){ if (!f.sel.has(nd[key])) return false; }
    else if (f.mode === "range"){ const v = nd[key]; if (v === undefined || v > f.max) return false; }
  }
  return true;
}
function applyFilter(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  let vis = 0;
  NODES.forEach(nd => {
    let ok = passFilter(nd);
    if (ok && q) ok = (nd.n || "").toLowerCase().includes(q);
    nd.g.style.display = ok ? "" : "none";
    if (ok) vis++;
    nd.g.classList.toggle("hit", !!(q && (nd.n || "").toLowerCase().includes(q)));
  });
  EDGES.forEach(e => {
    const show = e.a.g.style.display !== "none" && e.b.g.style.display !== "none";
    e.line.style.display = show ? "" : "none";
  });
  document.getElementById("stats").innerHTML =
    `${DATA.name}：<b>${NODES.length}</b> 节点 · <b>${EDGES.length}</b> 依赖边 · 当前显示 <b>${vis}</b>`;
}
document.getElementById("q").addEventListener("input", applyFilter);

/* ================= 初始化 ================= */
function init(d){
  normalize(d);
  buildAdj();
  initLayout();
  build();
  updateDOM();
  buildFiltersUI();
  applyFilter();
  fit();
}
loadSets();
</script>
</body>
